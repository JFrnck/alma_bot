services:
  - type: web
    name: alma-bot
    env: node
    region: oregon
    plan: free
    runtime: node
    autoDeploy: true

    buildCommand: npm install && npm run build
    startCommand: npm run start:prod

    envVars:
      - key: NODE_ENV
        value: production
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: ELEVENLABS_API_KEY
        sync: false
      - key: ELEVENLABS_VOICE_ID
        sync: false
      - key: APP_URL
        sync: false